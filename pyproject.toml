[project]
name = "riborescue"
version = "0.1.0"
description = "Match nonsense variants to candidate readthrough therapies."
requires-python = ">= 3.12"
# Every module the package imports directly is named here, including those a dependency happens to
# install today: statsmodels is migrating off patsy, and an import that survives only by transitive
# luck breaks without warning.
dependencies = [
    "pydantic>=2.7",
    "pandera>=0.20",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "patsy>=0.5",
    "scikit-learn>=1.5",
    "cyvcf2>=0.30",
    "pooch>=1.8",
    "biopython>=1.83",
    "click>=8.1",
    "dnaio>=1.2",
    "cutadapt>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "hypothesis>=6",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "pandas-stubs",
]

[project.scripts]
riborescue = "riborescue.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/riborescue"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
# One target, in two flavours: the plain subdir, and the same subdir carrying a declared CUDA
# driver. Only NMDetective-AI builds against the second, and every feature names which it wants, so
# nothing else resolves against a GPU that may not be there.
platforms = ["linux-64", { name = "linux-64-cuda", platform = "linux-64", cuda = "12" }]

# Only what the package needs to run. Everything else belongs to a feature, so the environment that
# ships in the container is the one the tests ran against, minus the tools that exist to develop it.
[tool.pixi.feature.base]
platforms = ["linux-64"]

[tool.pixi.feature.base.dependencies]
python = "3.12.*"
cyvcf2 = ">=0.34.0,<0.35"
dnaio = ">=1.2.4,<2"
cutadapt = ">=5.2,<6"
bioframe = ">=0.8.0,<0.9"

[tool.pixi.feature.base.pypi-dependencies]
riborescue = { path = "." }

[tool.pixi.feature.dev.dependencies]
pyright = "*"
r-languageserver = ">=0.3.18,<0.4"
# Report figures are generated, not drawn by hand, so the plotting library is a declared development
# dependency rather than something assumed present. Nothing the package ships imports it.
matplotlib-base = ">=3.9"
# The web app's toolchain. pyright pulls Node in regardless, being a Node program behind a Python
# wrapper, but a type checker's transitive dependency is not a build tool: named here, the floor the
# app needs is declared rather than inherited.
nodejs = ">=22"

[tool.pixi.feature.dev.pypi-dependencies]
riborescue = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.feature.pipeline.dependencies]
nextflow = ">=24.10"
nf-test = ">=0.9"
nf-core = ">=3.1"

[tool.pixi.feature.riboseq.dependencies]
fastqc = ">=0.12"
multiqc = ">=1.25"
cutadapt = ">=4.9"
# A letter suffix sorts before the bare version in conda, so >=2.7.11 would exclude 2.7.11b.
star = ">=2.7"
samtools = ">=1.21"
subread = ">=2.0.6"
pigz = ">=2.8"

[tool.pixi.feature.oracle.dependencies]
r-base = ">=4.5.3,<4.6"
"r-data.table" = ">=1.18.4,<2"
r-caret = ">=7.0_1,<8"
r-dplyr = ">=1.2.1,<2"
r-jsonlite = ">=2.0.0,<3"
r-optparse = ">=1.8.2,<2"

# riboWaltz calibrates P-site offsets and periodicity, the published tool the PRD names. Its build
# pins R 4.4, one minor version behind the caret oracle, so it resolves in its own environment.
[tool.pixi.feature.psite]
platforms = ["linux-64"]

[tool.pixi.feature.psite.dependencies]
ribowaltz = "2.0.*"
# riboWaltz builds its annotation through GenomicFeatures. txdbmaker its recipe genuinely omits;
# genomeinfodbdata already arrives transitively but is a data package whose payload installs in a
# post-link script, so it is promoted here to name what the committed pixi config must run.
bioconductor-txdbmaker = "*"
bioconductor-genomeinfodbdata = "*"
"r-data.table" = "*"
r-optparse = "*"
r-jsonlite = "*"

# The calibration runs in this environment because riboWaltz pins an R the caret oracle does not.
# One process per library, sequentially: a transcriptome alignment does not fit in memory alongside
# its neighbours, and an exited process is the only reliable way to give the memory back.
[tool.pixi.feature.psite.tasks]
annotation = { cmd = "Rscript scripts/run_psite.R --annotation-only --gtf data/gencode/gencode.v50.primary_assembly.annotation.gtf.gz --cache results/psite/_reference/gencode.v50.primary_assembly.annotation" }
psite = { cmd = "bash scripts/run_psite_all.sh hek293t results/staged_runs.tsv", env = { OPENBLAS_NUM_THREADS = "1" } }
psite-gse144140-survey = { cmd = "bash scripts/run_psite_all.sh gse144140 results/staged_runs.tsv", env = { OPENBLAS_NUM_THREADS = "1", LENGTHS = "18:40" } }
psite-fibroblast = { cmd = "bash scripts/run_psite_all.sh gse179274_fibroblast results/staged_runs.tsv", env = { OPENBLAS_NUM_THREADS = "1" } }

# aenmd (Klonowski et al., Bioinformatics 2023) is the rule-based NMD model tier — a real, independent
# implementation of the escape rules the ensemble computes by hand. Its Bioconductor stack and the
# ~1 GB NCBI GRCh38 genome package live in their own environment so the default toolchain stays lean.
# The package and its Ensembl-v105 data package are GitHub-only (not Bioconductor), installed from
# pinned commits by scripts/install_aenmd.R; the heavy dependencies below come from bioconda so they
# are captured in pixi.lock.
[tool.pixi.feature.aenmd]
platforms = ["linux-64"]

[tool.pixi.feature.aenmd.dependencies]
r-base = "4.5.*"
r-remotes = "*"
r-optparse = "*"
r-triebeard = "*"
r-vcfr = "*"
bioconductor-variantannotation = "*"
bioconductor-bsgenome = "*"
"bioconductor-bsgenome.hsapiens.ncbi.grch38" = "*"
bioconductor-ensembldb = "*"
bioconductor-genomicfeatures = "*"
bioconductor-genomicranges = "*"
bioconductor-genomeinfodb = "*"
bioconductor-biostrings = "*"
bioconductor-biocfilecache = "*"

[tool.pixi.feature.aenmd.tasks]
aenmd-install = "Rscript scripts/install_aenmd.R"
aenmd = { cmd = "Rscript scripts/aenmd_nmd.R --variants results/clinvar_nonsense.tsv --out results/aenmd.tsv", env = { OPENBLAS_NUM_THREADS = "1" } }

# NMDetective-AI (Veiner et al. 2026; Vejni/NMDetectiveAI, MIT) is the model tier's deep member — a
# fine-tuned Orthrus/Mamba encoder that runs on the local GPU. Its CUDA stack (PyTorch, GenomeKit,
# mamba-ssm/causal-conv1d from conda-forge) lives in its own environment; the package and its LFS
# weights are cloned from a pinned commit by scripts/install_nmdetective.sh.
# WSL2 GPU passthrough does not always expose the CUDA driver to the solver's virtual-package
# detection, so this environment builds against the platform that declares one.
[tool.pixi.feature.nmdetective]
platforms = ["linux-64-cuda"]

[tool.pixi.feature.nmdetective.dependencies]
python = "3.10.*"
pytorch-gpu = ">=2.4"
genomekit = "*"
mamba-ssm = "*"
causal-conv1d = "*"
git = "*"
git-lfs = "*"
biopython = "*"
typer = "*"
loguru = "*"
tqdm = "*"
pandas = "*"
numpy = "*"
scipy = "*"
scikit-learn = "*"
statsmodels = "*"
matplotlib = "*"
seaborn = "*"
openpyxl = "*"
wandb = "*"
einops = "*"
safetensors = "*"
pybigwig = "*"
pip = "*"
# transformers / tokenizers / huggingface-hub are pinned for the Orthrus remote code, but the conda
# solve pins a newer huggingface-hub; matching the upstream recipe, scripts/install_nmdetective.sh
# pip-installs the pinned trio after the env is built rather than letting the solver reconcile them.

[tool.pixi.feature.nmdetective.tasks]
nmdetective-install = "bash scripts/install_nmdetective.sh"
nmdetective = { cmd = "python scripts/nmdetective_predict.py --nonsense results/clinvar_nonsense.tsv --mane-summary data/mane/MANE.GRCh38.v1.5.summary.txt.gz --model vendor/NMDetectiveAI/models/NMDetectiveAI.pt --out results/nmdetective.tsv" }

# One solve group, so the runtime environment resolves to the versions the development environment
# did. A container built from a different resolution proves nothing about what was tested.
[tool.pixi.environments]
default = { features = ["base", "dev", "pipeline", "oracle", "riboseq"], no-default-feature = true, solve-group = "riborescue" }
runtime = { features = ["base"], no-default-feature = true, solve-group = "riborescue" }
psite = { features = ["psite"], no-default-feature = true }
aenmd = { features = ["aenmd"], no-default-feature = true }
nmdetective = { features = ["nmdetective"], no-default-feature = true }

[tool.pixi.feature.base.tasks]
lint = "ruff check ."
format = "ruff check --select I --fix . && ruff format ."
types = "pyright"
test = { cmd = "pytest -n auto", env = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1" } }
test-slow = { cmd = "pytest -m slow -n auto", env = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1" } }
test-cov = { cmd = "pytest --cov=riborescue --cov-report=term-missing", env = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1" } }
check = { depends-on = ["lint", "types", "test"] }
triage = "riborescue triage"
fetch = "riborescue fetch"
oracle = { cmd = "Rscript scripts/run_oracle.R", depends-on = ["fetch"] }
evaluate = { cmd = "riborescue evaluate tests/fixtures/oracle/features_*.tsv.gz --out results/evaluation.tsv", env = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1" } }
clinvar = "riborescue clinvar data/clinvar/clinvar_20260715.vcf.gz --out results/clinvar_nonsense.tsv"
contexts = """riborescue contexts results/clinvar_nonsense.tsv \
  --annotation data/mane/MANE.GRCh38.v1.5.refseq_genomic.gff.gz \
  --transcripts data/mane/MANE.GRCh38.v1.5.refseq_rna.fna.gz \
  --proteins data/mane/MANE.GRCh38.v1.5.refseq_protein.faa.gz \
  --out results/clinvar_contexts.tsv"""
score = { cmd = "riborescue score results/clinvar_contexts.tsv tests/fixtures/oracle/features_*.tsv.gz --out results/variant_therapy_scores.tsv", env = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1" } }
landscape = "riborescue landscape results/clinvar_contexts.tsv results/variant_therapy_scores.tsv --out results/amenability_landscape.tsv --summary results/landscape_summary.tsv"
extensions = "riborescue extensions data/gencode/gencode.v50.transcripts.fa.gz --annotation results/psite/_reference/gencode.v50.primary_assembly.annotation/annotation.tsv --out results/psite/_reference/gencode.v50.primary_assembly.annotation/extensions.tsv"
trna-coverage = "riborescue trna-coverage results/clinvar_contexts.tsv --out results/trna_coverage.tsv"
trna-panel = "riborescue trna-panel results/clinvar_contexts.tsv --objective genes --out results/trna_panel_genes.tsv"
base-editing = { cmd = """riborescue base-editing results/clinvar_nonsense.tsv \
  --annotation data/mane/MANE.GRCh38.v1.5.refseq_genomic.gff.gz \
  --transcripts data/mane/MANE.GRCh38.v1.5.refseq_rna.fna.gz \
  --out results/base_editing.tsv""", depends-on = ["clinvar"] }
escape-map = { cmd = "riborescue escape-map results/base_editing.tsv results/variant_therapy_scores.tsv --out results/escape_map.tsv", depends-on = ["base-editing", "score"] }
diseases = { cmd = "riborescue diseases results/clinvar_nonsense.tsv --out results/diseases.tsv", depends-on = ["clinvar"] }
disease-coverage = { cmd = "riborescue disease-coverage results/diseases.tsv --contexts results/clinvar_contexts.tsv --out results/disease_coverage.tsv", depends-on = ["diseases", "contexts"] }
disease-panel = { cmd = "riborescue disease-panel results/diseases.tsv --contexts results/clinvar_contexts.tsv --out results/disease_panel.tsv", depends-on = ["diseases", "contexts"] }
atlas = """riborescue atlas results/psite/gse144140/readthrough_counts.tsv \
  --gtf data/gencode/gencode.v50.primary_assembly.annotation.gtf.gz \
  --samplesheet results/staged_runs.tsv --dataset gse144140 --control dmso \
  --transcripts data/gencode/gencode.v50.transcripts.fa.gz \
  --annotation results/psite/_reference/gencode.v50.primary_assembly.annotation/annotation.tsv \
  --extensions results/psite/_reference/gencode.v50.primary_assembly.annotation/extensions.tsv \
  --out results/atlas/gse144140_native_stops.tsv"""
atlas-predict = """riborescue atlas-predict \
  --transcripts data/gencode/gencode.v50.transcripts.fa.gz \
  --annotation results/psite/_reference/gencode.v50.primary_assembly.annotation/annotation.tsv \
  --training tests/fixtures/oracle/features_G418.tsv.gz \
  --measured results/atlas/gse144140_native_stops.tsv \
  --gtf data/gencode/gencode.v50.primary_assembly.annotation.gtf.gz \
  --out results/atlas/gse144140_predicted.tsv"""
readthrough = "bash scripts/run_readthrough.sh hek293t untreated both"
select-lengths-gse144140 = "riborescue select-lengths gse144140 --frames results/psite/gse144140/frame_by_length.tsv --offsets results/psite/gse144140/psite_offsets.tsv --script-md5 results/psite/gse144140/script.md5 --out results/psite/gse144140/calibration.json"
readthrough-gse144140 = { cmd = "bash scripts/run_readthrough.sh gse144140 dmso both", depends-on = ["select-lengths-gse144140"] }
# GSE179274 is the only public profiling of a suppressor tRNA. Its calibration is reproducible by
# this command and refuses the dataset: five of ten libraries miss the predeclared depth or offset,
# including both suppressor-tRNA libraries and the EGFP control they would be tested against, so all
# three contrasts ADR-0010 names are unrunnable. The thresholds are not moved (ADR-0011, ADR-0013).
select-lengths-fibroblast = "riborescue select-lengths gse179274_fibroblast --frames results/psite/gse179274_fibroblast/frame_by_length.tsv --offsets results/psite/gse179274_fibroblast/psite_offsets.tsv --script-md5 results/psite/gse179274_fibroblast/script.md5 --out results/psite/gse179274_fibroblast/calibration.json"
readthrough-fibroblast = { cmd = "bash scripts/run_readthrough.sh gse179274_fibroblast untreated unpaired g418_0.1 g418_0.5", depends-on = ["readthrough-suptrna"] }
readthrough-suptrna = "bash scripts/run_readthrough.sh gse179274_fibroblast egfp unpaired suptrna_tyr"
# What that refused dataset can still say: not whether the suppressor tRNA works, but how large an
# effect its design could have resolved, and what would have to change to resolve a smaller one
# (ADR-0019). Exploratory, written where no production task reads.
detectability-fibroblast = "bash scripts/run_detectability.sh gse179274_fibroblast suptrna_tyr egfp g418_0.1:untreated g418_0.5:untreated"
# The kinetic layer's input (ADR-0020). Vehicle libraries only, both sites and both length windows,
# and the command refuses a treated library rather than skipping it.
codon-occupancy = "bash scripts/run_codon_occupancy.sh gse144140 dmso"
# The kinetics comparison itself: four models over three splits, each kinetic model also under the
# three shuffles. Grouped by gene is where the claim lives; the other two say whether a gain is
# capacity rather than signal, so all three run.
head-to-head = "bash scripts/run_head_to_head.sh"
# The corrected shuffle null (ADR-0021): 199 synchronised permutations per family, sharded by
# permutation index, each shard resuming from what it already wrote. Under an hour, and the only
# heavy job that should be running.
permutation-null = "bash scripts/run_permutation_null.sh"
# Which experiment would settle which open question. Never says a therapy will work.
experiments = """riborescue experiments \
  --contexts results/clinvar_contexts.tsv --diseases results/diseases.tsv \
  --landscape results/amenability_landscape.tsv --out results/experiments.tsv"""
permutation-report = """riborescue permutation-report results/kinetics/permutation_null/null.tsv \
  --observed results/kinetics/permutation_null/null.0_observed.tsv \
  --out results/kinetics/permutation_null/familywise.tsv"""
# The per-drug ceiling every held-out score is read against, from the authors' own two replicates.
reliability = "Rscript scripts/export_reliability.R"
# What a reader needs to regenerate the results: commit, locked toolchain, every input with its
# checksum, the command behind each output, and what could not be found.
provenance = "python scripts/provenance.py"
disk = "bash scripts/require_disk.sh 200"
prefetch = { cmd = "bash scripts/prefetch_runs.sh pipeline/assets/riboseq_samples.tsv", depends-on = ["disk"] }
stage-runs = { cmd = "riborescue stage-runs pipeline/assets/riboseq_samples.tsv --out results/staged_runs.tsv", depends-on = ["prefetch"] }
adapter-survey = { cmd = "riborescue adapter-survey results/staged_runs.tsv --out docs/figures/adapter_survey.tsv", depends-on = ["stage-runs"] }
reads = { cmd = """nextflow run . --step reads -profile local -resume \
  --outdir ../results/reads \
  --samplesheet ../results/staged_runs.tsv \
  --genome ../data/gencode/GRCh38.primary_assembly.genome.fa.gz \
  --annotation ../data/gencode/gencode.v50.primary_assembly.annotation.gtf.gz \
  --contaminants ../data/gencode/gencode.v50.transcripts.fa.gz \
  --rdna ../data/rdna/U13369.1.fasta""", cwd = "pipeline", depends-on = ["stage-runs", "adapter-survey"] }
nf-test = { cmd = "nf-test test", cwd = "pipeline" }
nf-lint = { cmd = "nextflow lint .", cwd = "pipeline" }
# The matched RNA-seq arm: abundance, which the footprint libraries cannot give. Counted over union
# exons on the paired libraries, then turned into TPM, the composition, and both rankings.
quantify = """featureCounts -T 6 -p --countReadPairs -t exon -g gene_id \
  -a data/gencode/gencode.v50.primary_assembly.annotation.gtf.gz \
  -o results/rnaseq/counts.tsv \
  results/reads/alignments/calu6_untreated_rep1_rnaseq.sorted.bam \
  results/reads/alignments/calu6_untreated_rep2_rnaseq.sorted.bam \
  results/reads/alignments/calu6_g418_rep1_rnaseq.sorted.bam \
  results/reads/alignments/calu6_g418_rep2_rnaseq.sorted.bam"""
expression = { cmd = """riborescue expression results/rnaseq/counts.tsv \
  --annotation data/gencode/gencode.v50.primary_assembly.annotation.gtf.gz \
  --tpm-out results/rnaseq/tpm.tsv \
  --nuclear-out results/rnaseq/top_expressed_nuclear.tsv \
  --composition-out results/rnaseq/composition.tsv \
  --out results/rnaseq/top_expressed.tsv""", depends-on = ["quantify"] }
expression-figures = { cmd = "bash scripts/plot_expression_all.sh", depends-on = ["expression"] }
escape-figure = { cmd = "python scripts/plot_escape_map.py", depends-on = ["escape-map"] }
course-figures = """python scripts/plot_course_qc.py \
  --samples pipeline/assets/riboseq_samples.tsv \
  --multiqc results/reads/qc/multiqc_data/multiqc_general_stats.txt \
  --trimming results/reads/qc/trim_summary.tsv \
  --alignment results/reads/qc/alignment_summary.tsv \
  --outdir results/reads/qc"""
nmd = { cmd = "riborescue nmd results/clinvar_contexts.tsv --out results/nmd.tsv", depends-on = ["contexts"] }
# aenmd's raw per-transcript run is the heavy `aenmd` env task (scripts/aenmd_nmd.R); this reads it
# down to one MANE-transcript verdict per variant, in the default env, so the export can join it.
aenmd-verdicts = { cmd = "riborescue aenmd-verdicts --aenmd results/aenmd.tsv --nonsense results/clinvar_nonsense.tsv --mane-summary data/mane/MANE.GRCh38.v1.5.summary.txt.gz --contexts results/clinvar_contexts.tsv --out results/aenmd_verdicts.tsv" }
# The dry-lab chain alone builds the viewer's data; the safety panel and the two model tiers are
# added by export-web-safety where the Ribo-seq atlas, the aenmd env and the nmdetective env have
# run, so the app builds on a laptop that never ran the sequencing arm. Both it and the plain
# example write the same slice the app ships — export-web, without `--sample`, writes all 70k rows
# and is for pointing the viewer at a dataset of your own.
export-web = { cmd = "riborescue export-web --landscape results/amenability_landscape.tsv --amenability results/variant_therapy_scores.tsv --nmd results/nmd.tsv --base-editing results/base_editing.tsv --out frontend/public/riborescue.json", depends-on = ["nmd", "base-editing"] }
export-web-safety = { cmd = "riborescue export-web --landscape results/amenability_landscape.tsv --amenability results/variant_therapy_scores.tsv --predicted results/atlas/gse144140_predicted.tsv --sample 48 --nmd results/nmd.tsv --aenmd results/aenmd_verdicts.tsv --nmdetective results/nmdetective.tsv --base-editing results/base_editing.tsv --out frontend/public/riborescue.json", depends-on = ["nmd", "export-research-tiers", "base-editing"] }
export-web-example = { cmd = "riborescue export-web --landscape results/amenability_landscape.tsv --amenability results/variant_therapy_scores.tsv --sample 48 --nmd results/nmd.tsv --base-editing results/base_editing.tsv --out frontend/public/riborescue.json", depends-on = ["nmd", "base-editing"] }
# The researcher dashboard's aggregate: coverage frontiers and per-disease coverage, no variant rows.
# The tiers variant adds the two independent NMD models' agreement, which needs their environments.
# The evidence page's payload: the controls, the calibration and the checks behind them.
# Every input is optional, so a machine that ran no sequencing still writes a readable file.
export-evidence = { cmd = """riborescue export-evidence --dataset gse144140 \
  --samplesheet results/staged_runs.tsv \
  --readthrough results/readthrough/gse144140 \
  --calibration results/psite/gse144140/calibration.json \
  --frames results/psite/gse144140/frame_by_length.tsv \
  --metaprofile results/psite/gse144140/metaprofile.tsv \
  --codon-occupancy results/kinetics/gse144140/codon_occupancy.a.selected.tsv \
  --codon-occupancy results/kinetics/gse144140/codon_occupancy.p.selected.tsv \
  --permutation-null results/kinetics/permutation_null/familywise.tsv \
  --predicted results/atlas/gse144140_predicted.tsv \
  --metrics tests/fixtures/oracle/metrics.tsv \
  --reliability tests/fixtures/oracle/reliability.tsv \
  --out frontend/public/riborescue_evidence.json""" }
# The whole scored set as one columnar payload, so the lookup view covers every variant rather than
# a sample. Regenerated from the result tables, and committed alongside the smaller payloads because
# Cloudflare Pages builds the app with `next build` alone and cannot run this.
export-index = { cmd = "python scripts/build_variant_index.py" }
export-research = { cmd = "riborescue export-research results/diseases.tsv --contexts results/clinvar_contexts.tsv --clinvar-release 20260715 --experiments results/experiments.tsv --base-editing results/base_editing.tsv --out frontend/public/riborescue_research.json", depends-on = ["diseases", "contexts", "base-editing"] }
export-research-tiers = { cmd = "riborescue export-research results/diseases.tsv --contexts results/clinvar_contexts.tsv --clinvar-release 20260715 --aenmd results/aenmd_verdicts.tsv --nmdetective results/nmdetective.tsv --experiments results/experiments.tsv --base-editing results/base_editing.tsv --out frontend/public/riborescue_research.json", depends-on = ["diseases", "contexts", "base-editing"] }
app-install = { cmd = "npm install", cwd = "frontend" }
app-dev = { cmd = "npm run dev", cwd = "frontend" }
app-build = { cmd = "npm run build", cwd = "frontend" }
# The payload types are hand-written against what the exporters emit, so the compiler checking them
# against the pages that read them is the only thing that says the two agree.
app-typecheck = { cmd = "npm run typecheck", cwd = "frontend" }
# Serve the built export. This is what ships, and it is the preview to check a page against; the
# dev server renders the same pages through a different runtime.
app-preview = { cmd = "python -m http.server 3001 --directory out", cwd = "frontend", depends-on = ["app-build"] }
# Regenerate the viewer's data from the result tables and build the static bundle in one step.
# The explorer and patient views read an example slice, not the full set, so the app never ships a
# 70k-row browser payload; the researcher view reads the whole-set coverage aggregate instead.
site = { depends-on = ["export-web-example", "export-research", "export-index", "app-install", "app-build"] }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
allowed-confusables = ["×"]

[tool.ruff.lint.pep8-naming]
# pandera passes the schema class to its checks
classmethod-decorators = ["pandera.pandas.dataframe_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "-m", "not slow"]
markers = [
    "control: protected negative controls; must not be silently removed",
    "parity: reproduction parity against the R oracle golden fixtures",
    "integration: needs multiple modules or external tools",
    "slow: long-running",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
