[project]
name = "riborescue"
version = "0.1.0"
description = "Match nonsense variants to candidate readthrough therapies."
requires-python = ">= 3.12"
dependencies = [
    "pydantic>=2.7",
    "pandera>=0.20",
    "pandas>=2.2",
    "pyarrow>=16",
    "biopython>=1.83",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "pandas-stubs",
]

[project.scripts]
riborescue = "riborescue.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/riborescue"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
pyright = "*"
nextflow = ">=24.10"
nf-test = ">=0.9"
nf-core = ">=3.1"

[tool.pixi.pypi-dependencies]
riborescue = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.tasks]
lint = "ruff check ."
format = "ruff check --select I --fix . && ruff format ."
types = "pyright"
test = "pytest"
test-cov = "pytest --cov=riborescue --cov-report=term-missing"
check = { depends-on = ["lint", "types", "test"] }
triage = "riborescue triage"
nf-test = { cmd = "nf-test test", cwd = "pipeline" }
nf-lint = { cmd = "nextflow lint .", cwd = "pipeline" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
allowed-confusables = ["×"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
markers = [
    "control: protected negative controls; must not be silently removed",
    "parity: reproduction parity against the R oracle golden fixtures",
    "integration: needs multiple modules or external tools",
    "slow: long-running",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
