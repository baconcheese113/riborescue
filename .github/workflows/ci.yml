on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0
        with:
          # The lockfile is the environment; a run that resolves something else proves nothing.
          locked: true
      - run: pixi run check
      # The reproduction parity check refits the published model on every committed round. It is the
      # evidence that the Python baseline still matches the authors' R, so it runs on every push
      # rather than on a schedule.
      - run: pixi run test-slow

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0
        with:
          locked: true
      - run: pixi run nf-lint
      - run: pixi run nf-test

  image:
    name: runtime image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag riborescue:${{ github.sha }} .
      # The image exists to run the command Nextflow calls, so the check is that it does.
      - run: docker run --rm riborescue:${{ github.sha }} riborescue triage stop_gained
      # And that its environment is the one the lockfile describes, not a fresh resolution. Every
      # third-party module the package imports is named, so a dependency the lockfile stops
      # carrying fails here rather than at the first command that reaches for it.
      - run: |
          docker run --rm riborescue:${{ github.sha }} python -c "
          import Bio, bioframe, click, cutadapt, cyvcf2, dnaio, numpy, pandas
          import pandera, patsy, pooch, pydantic, scipy, sklearn, statsmodels
          print('every direct import resolves')"
